<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <pattern id="screentone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
    <filter id="inkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="260" fill="#141418"/>
  <rect width="960" height="260" fill="url(#screentone)"/>
  
  <!-- Outer Ink Border -->
  <rect x="4" y="4" width="952" height="252" fill="none" stroke="#2a2a34" stroke-width="2"/>
  <rect x="12" y="12" width="936" height="236" fill="none" stroke="#e2e2e8" stroke-width="3"/>

  <!-- Brand Content Group -->
  <g transform="translate(48, 56)">
    <!-- Red Hanko Stamp -->
    <g filter="url(#inkShadow)">
      <rect x="0" y="0" width="86" height="86" rx="12" fill="#d90429" stroke="#ffffff" stroke-width="3.5"/>
      <text x="43" y="62" font-family="'Yu Gothic', 'Hiragino Sans', 'Meiryo', 'Noto Sans JP', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">ロ</text>
    </g>

    <!-- Title & Badge Group -->
    <g transform="translate(112, 0)">
      <!-- Japanese Main Title -->
      <text x="0" y="52" font-family="'Yu Gothic', 'Hiragino Sans', 'Meiryo', 'Noto Sans JP', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">ウォール・ローゼ</text>
      
      <!-- English Identity -->
      <text x="390" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#a6a6b5" letter-spacing="1">WALL ROSE</text>

      <!-- Version Badge (tilted 3deg) -->
      <g transform="translate(560, 18) rotate(3)">
        <rect x="0" y="0" width="76" height="28" fill="#ffb703" stroke="#141416" stroke-width="2.5" rx="3"/>
        <text x="38" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#141416" text-anchor="middle" letter-spacing="1">v1.0.0</text>
      </g>

      <!-- Subtitle Description -->
      <text x="0" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14.5" fill="#888898" letter-spacing="1.5">MULTI-PROTOCOL PERSONAL VPN GATEWAY // RESILIENT ANTI-CENSORSHIP INFRASTRUCTURE</text>

      <!-- Protocol Capability Pills -->
      <g transform="translate(0, 108)">
        <!-- Pill 1: AWG 3.1 -->
        <rect x="0" y="0" width="180" height="24" rx="4" fill="#1e1e26" stroke="#444454" stroke-width="1.5"/>
        <text x="90" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#48cae4" text-anchor="middle">AWG 3.1 (ChaCha20)</text>

        <!-- Pill 2: AWG 2.0 -->
        <rect x="190" y="0" width="170" height="24" rx="4" fill="#1e1e26" stroke="#444454" stroke-width="1.5"/>
        <text x="275" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ffb703" text-anchor="middle">AWG 2.0 (Router Fix)</text>

        <!-- Pill 3: Hysteria 2 -->
        <rect x="370" y="0" width="190" height="24" rx="4" fill="#1e1e26" stroke="#444454" stroke-width="1.5"/>
        <text x="465" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ef233c" text-anchor="middle">Hysteria 2.9 (Brutal QUIC)</text>

        <!-- Pill 4: Unbound DoT -->
        <rect x="570" y="0" width="160" height="24" rx="4" fill="#1e1e26" stroke="#444454" stroke-width="1.5"/>
        <text x="650" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#95d5b2" text-anchor="middle">Unbound DNS-over-TLS</text>
      </g>
    </g>
  </g>
</svg>
